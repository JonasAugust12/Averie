---
- name: Install Docker Engine
  hosts: web
  become: yes

  tasks:
      - name: PRE-CHECK | Is Docker already present
        command: docker --version
        register: docker_binary_check
        failed_when: false
        changed_when: false

      - name: PRE-CHECK | Report
        debug:
            msg: 'Docker already installed — skipping installation tasks.'
        when: docker_binary_check.rc == 0

      # -----------------------------------------------------------------------
      # INSTALL (only when Docker is missing)
      # -----------------------------------------------------------------------
      - name: INSTALL | Base dependencies
        apt:
            name:
                - apt-transport-https
                - ca-certificates
                - curl
                - gnupg
                - lsb-release
            state: present
            update_cache: yes
        when: docker_binary_check.rc != 0

      - name: INSTALL | Ensure keyrings directory exists
        file:
            path: /usr/share/keyrings
            state: directory
            mode: '0755'
        when: docker_binary_check.rc != 0

      - name: INSTALL | Download Docker GPG key
        get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /tmp/docker.gpg.asc
            mode: '0644'
        when: docker_binary_check.rc != 0

      - name: INSTALL | Dearmor Docker GPG key
        command: gpg --dearmor -o /usr/share/keyrings/docker.gpg /tmp/docker.gpg.asc
        args:
            creates: /usr/share/keyrings/docker.gpg
        when: docker_binary_check.rc != 0

      - name: INSTALL | Fix key permissions
        file:
            path: /usr/share/keyrings/docker.gpg
            mode: '0644'
        when: docker_binary_check.rc != 0

      - name: INSTALL | Add Docker apt repository
        apt_repository:
            repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/usr/share/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
            state: present
            filename: docker
        when: docker_binary_check.rc != 0

      - name: INSTALL | Docker engine and plugins
        apt:
            name:
                - docker-ce
                - docker-ce-cli
                - containerd.io
                - docker-buildx-plugin
                - docker-compose-plugin
            state: present
            update_cache: yes
        when: docker_binary_check.rc != 0

      # -----------------------------------------------------------------------
      # CONFIGURE (always — keeps the host in a known-good state)
      # -----------------------------------------------------------------------
      - name: CONFIG | Python Docker SDK for the community.docker modules
        apt:
            name: python3-docker
            state: present
            update_cache: yes

      - name: CONFIG | Cap container log growth (1 GB disks fill fast)
        copy:
            dest: /etc/docker/daemon.json
            mode: '0644'
            content: |
                {
                  "log-driver": "json-file",
                  "log-opts": { "max-size": "10m", "max-file": "3" }
                }
        register: docker_daemon_config

      - name: CONFIG | Docker service running and enabled
        systemd:
            name: docker
            state: "{{ 'restarted' if docker_daemon_config.changed else 'started' }}"
            enabled: yes
            daemon_reload: yes

      - name: CONFIG | Ensure docker group exists
        group:
            name: docker
            state: present

      - name: CONFIG | Allow the login user to run docker
        user:
            name: '{{ ansible_env.SUDO_USER | default(ansible_user) }}'
            groups: docker
            append: yes

      - name: VERIFY | Docker version
        command: docker --version
        register: docker_version
        changed_when: false

      - name: VERIFY | Show version
        debug:
            var: docker_version.stdout
