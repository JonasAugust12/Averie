---
- name: Deploy Averie web stack
  hosts: web
  become: yes

  pre_tasks:
      - name: Require an image tag
        assert:
            that:
                - image_tag is defined
                - image_tag | length > 0
                - image_tag != 'latest' or allow_latest | default(false)
            fail_msg: >-
                Pass an immutable tag: -e image_tag=main-<sha>.
                Use -e allow_latest=true only for manual smoke tests.

      - name: Require registry credentials
        assert:
            that:
                - registry_username is defined and registry_username | length > 0
                - registry_password is defined and registry_password | length > 0
            fail_msg: 'Pass -e registry_username=... -e registry_password=...'

      - name: Require the registry namespace
        assert:
            that:
                - registry_namespace is defined
                - registry_namespace | length > 0
            fail_msg: >-
                registry_namespace is empty. Bizfly image paths are
                <host>/<namespace>/<repo>; copy the namespace from the push
                command shown in the Container Registry console.

      - name: Require app secrets
        assert:
            that:
                - mongodb_uri is defined and mongodb_uri | length > 0
                - auth_secret is defined and auth_secret | length > 0
            fail_msg: 'Pass -e mongodb_uri=... -e auth_secret=...'
        no_log: true

  tasks:
      # -----------------------------------------------------------------------
      # Host prerequisites
      # -----------------------------------------------------------------------
      - name: Ensure directories exist
        file:
            path: '{{ item }}'
            state: directory
            mode: '0755'
        loop:
            - '{{ app_dir }}'
            - '{{ app_dir }}/nginx'
            - '{{ app_dir }}/certbot/www'
            - '{{ app_dir }}/certbot/conf'

      - name: Ensure the shared docker network exists
        community.docker.docker_network:
            name: '{{ docker_network }}'
            state: present

      - name: Log in to Bizfly Container Registry
        community.docker.docker_login:
            registry_url: '{{ registry_host }}'
            username: '{{ registry_username }}'
            password: '{{ registry_password }}'
            reauthorize: yes
        no_log: true

      # -----------------------------------------------------------------------
      # Capture the running image so a failed rollout can be reverted
      # -----------------------------------------------------------------------
      - name: Read the running image reference
        shell: docker inspect --format='{% raw %}{{ .Config.Image }}{% endraw %}' {{ app_container }}
        register: current_image_cmd
        failed_when: false
        changed_when: false

      - name: Set deployment facts
        set_fact:
            previous_image: "{{ current_image_cmd.stdout | trim if current_image_cmd.rc == 0 else '' }}"
            new_image: '{{ registry_image }}:{{ image_tag }}'

      - name: Determine whether rollback is possible
        set_fact:
            can_rollback: '{{ previous_image | length > 0 and previous_image != new_image }}'

      # -----------------------------------------------------------------------
      # Render configuration
      # -----------------------------------------------------------------------
      - name: Render runtime environment file
        template:
            src: templates/app.env.j2
            dest: '{{ app_dir }}/app.env'
            owner: root
            group: root
            mode: '0600'
        register: app_env
        no_log: true

      - name: Render Nginx configuration
        template:
            src: templates/nginx.conf.j2
            dest: '{{ app_dir }}/nginx/nginx.conf'
            mode: '0644'
        register: nginx_config

      - name: Render docker-compose file
        template:
            src: templates/docker-compose.yml.j2
            dest: '{{ app_dir }}/docker-compose.yml'
            mode: '0644'
        register: app_compose

      # -----------------------------------------------------------------------
      # Deploy
      # -----------------------------------------------------------------------
      - name: Bring up the stack
        community.docker.docker_compose_v2:
            project_src: '{{ app_dir }}'
            state: present
            pull: always
            remove_orphans: yes
            recreate: "{{ 'always' if (app_compose.changed or app_env.changed or nginx_config.changed) else 'auto' }}"

      - name: Wait for the app container to report healthy
        community.docker.docker_container_info:
            name: '{{ app_container }}'
        register: container_info
        until:
            - container_info.container is defined
            - container_info.container.State.Health is defined
            - container_info.container.State.Health.Status == 'healthy'
        retries: '{{ health_retries }}'
        delay: '{{ health_delay }}'
        ignore_errors: yes

      # -----------------------------------------------------------------------
      # Roll back when the healthcheck never goes green
      # -----------------------------------------------------------------------
      - name: Handle failed deployment
        when: >-
            container_info.container is not defined
            or container_info.container.State.Health is not defined
            or container_info.container.State.Health.Status != 'healthy'
        block:
            - name: Collect container logs for the failure report
              shell: docker logs --tail 80 {{ app_container }} 2>&1
              register: failed_logs
              failed_when: false
              changed_when: false

            - name: Show container logs
              debug:
                  var: failed_logs.stdout_lines

            - name: Fail when there is no previous image to roll back to
              fail:
                  msg: 'Healthcheck failed and no previous image exists to roll back to.'
              when: not can_rollback

            - name: Announce rollback
              debug:
                  msg: 'Healthcheck failed - rolling back to {{ previous_image }}'

            - name: Re-render compose with the previous image
              template:
                  src: templates/docker-compose.yml.j2
                  dest: '{{ app_dir }}/docker-compose.yml'
                  mode: '0644'
              vars:
                  custom_image: '{{ previous_image }}'

            - name: Redeploy the previous image
              community.docker.docker_compose_v2:
                  project_src: '{{ app_dir }}'
                  state: present
                  recreate: always

            - name: Verify health after rollback
              community.docker.docker_container_info:
                  name: '{{ app_container }}'
              register: rollback_info
              until:
                  - rollback_info.container is defined
                  - rollback_info.container.State.Health is defined
                  - rollback_info.container.State.Health.Status == 'healthy'
              retries: 10
              delay: 10

            - name: Report the rollback
              fail:
                  msg: '{{ new_image }} failed its healthcheck. Rolled back to {{ previous_image }} and verified it is healthy.'

      # -----------------------------------------------------------------------
      # Housekeeping
      # -----------------------------------------------------------------------
      - name: Prune dangling images
        community.docker.docker_prune:
            images: yes
            images_filters:
                dangling: true

      - name: Log out of the registry
        community.docker.docker_login:
            registry_url: '{{ registry_host }}'
            state: absent
        no_log: true

      - name: Deployment summary
        debug:
            msg: '{{ app_container }} is healthy on {{ new_image }} - vhost {{ app_vhost }}'
