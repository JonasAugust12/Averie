---
# =============================================================================
# One-off: obtain a Let's Encrypt certificate for app_vhost and install the
# renewal cron job.
#
# Run this AFTER the DNS A record points at this server and the stack is up on
# port 80 (enable_tls still false). Then set `enable_tls: true` in
# group_vars/all.yml and re-run deploy_app.yml to switch Nginx to HTTPS.
#
#   ansible-playbook issue_cert.yml -e letsencrypt_email=you@example.com
# =============================================================================
- name: Issue and auto-renew the TLS certificate
  hosts: web
  become: yes

  pre_tasks:
      - name: Require an email for Let's Encrypt
        assert:
            that:
                - letsencrypt_email is defined
                - letsencrypt_email | length > 0
            fail_msg: 'Pass -e letsencrypt_email=you@example.com'

  vars:
      cert_live_path: '{{ app_dir }}/certbot/conf/live/{{ app_vhost }}/fullchain.pem'

  tasks:
      - name: Check whether a certificate already exists
        stat:
            path: '{{ cert_live_path }}'
        register: existing_cert

      - name: Verify the ACME challenge path is reachable
        uri:
            url: 'http://{{ app_vhost }}/.well-known/acme-challenge/ansible-probe'
            status_code: [404, 403]
            timeout: 15
        when: not existing_cert.stat.exists
        register: acme_probe
        failed_when: acme_probe.status is not defined
        # A 404 from Nginx proves DNS resolves here and port 80 is open.

      - name: Request the certificate (webroot http-01)
        command: >-
            docker run --rm
            -v {{ app_dir }}/certbot/conf:/etc/letsencrypt
            -v {{ app_dir }}/certbot/www:/var/www/certbot
            certbot/certbot certonly --webroot -w /var/www/certbot
            {% for d in [app_vhost] + (extra_vhosts | default([])) %}-d {{ d }} {% endfor %}
            --email {{ letsencrypt_email }}
            --agree-tos --no-eff-email --non-interactive
        when: not existing_cert.stat.exists
        register: certbot_run

      - name: Show certbot output
        debug:
            var: certbot_run.stdout_lines
        when: certbot_run.stdout_lines is defined

      - name: Install the renewal script
        copy:
            dest: /usr/local/bin/averie-renew-cert.sh
            mode: '0755'
            content: |
                #!/bin/sh
                # Managed by Ansible. Renews the cert and reloads Nginx if it changed.
                set -e
                docker run --rm \
                  -v {{ app_dir }}/certbot/conf:/etc/letsencrypt \
                  -v {{ app_dir }}/certbot/www:/var/www/certbot \
                  certbot/certbot renew --webroot -w /var/www/certbot --quiet
                docker exec {{ nginx_container }} nginx -s reload || true

      - name: Schedule twice-daily renewal checks
        cron:
            name: 'averie letsencrypt renewal'
            minute: '17'
            hour: '3,15'
            job: '/usr/local/bin/averie-renew-cert.sh >> /var/log/averie-certbot.log 2>&1'

      - name: Next step
        debug:
            msg: >-
                Certificate ready. Set `enable_tls: true` in
                ansible/group_vars/all.yml and re-run deploy_app.yml
                to serve https://{{ app_vhost }}.
