paths:
    /actions/createBooking:
        post:
            tags: [Server Actions]
            summary: createBookingAction
            description: Invoked via Next.js Server Action — not a public HTTP endpoint.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [serviceIds, staffPreference, date, time, customer]
                            properties:
                                serviceIds:
                                    type: array
                                    items: { type: string }
                                staffPreference:
                                    type: string
                                    enum: [any, specific]
                                staffId:
                                    type: string
                                date:
                                    type: string
                                    example: '2026-08-15'
                                time:
                                    type: string
                                    example: '09:00 AM'
                                customer:
                                    type: object
                                    required: [firstName, lastName, phone]
                                    properties:
                                        firstName: { type: string }
                                        lastName: { type: string }
                                        phone: { type: string }
                                        email: { type: string }
                                        note: { type: string }
            responses:
                '201':
                    description: Booking created
                '409':
                    description: Slot conflict

    /actions/cancelBooking:
        post:
            tags: [Server Actions]
            summary: cancelBookingAction
            description: Admin only. Invoked via Server Action.
            parameters:
                - name: id
                  in: query
                  required: true
                  schema: { type: string }
            responses:
                '200':
                    description: Booking cancelled

    /actions/restoreBooking:
        post:
            tags: [Server Actions]
            summary: restoreBookingAction
            description: Admin only. Invoked via Server Action.
            parameters:
                - name: id
                  in: query
                  required: true
                  schema: { type: string }
            responses:
                '200':
                    description: Booking restored

    /actions/login:
        post:
            tags: [Server Actions]
            summary: loginAction
            description: Auth.js Credentials login via Server Action.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email: { type: string, format: email }
                                password: { type: string, minLength: 6 }
            responses:
                '200':
                    description: Signed in

    /actions/logout:
        post:
            tags: [Server Actions]
            summary: logoutAction
            description: Clears Auth.js session.
            responses:
                '200':
                    description: Signed out

    /actions/changeOwnPassword:
        post:
            tags: [Server Actions]
            summary: changeOwnPasswordAction
            description: Admin or staff. Updates the signed-in user's password after verifying the current password (bcrypt).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [currentPassword, newPassword, confirmPassword]
                            properties:
                                currentPassword:
                                    type: string
                                    minLength: 1
                                newPassword:
                                    type: string
                                    minLength: 6
                                confirmPassword:
                                    type: string
                                    minLength: 6
            responses:
                '200':
                    description: Password updated
                '400':
                    description: Validation failed or current password incorrect
                '401':
                    description: Unauthorized

    /actions/createServiceCategory:
        post:
            tags: [Server Actions]
            summary: createServiceCategoryAction
            description: Admin only.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name]
                            properties:
                                name:
                                    type: string
                                    maxLength: 100
                                sortOrder:
                                    type: integer
                                    minimum: 0
                                icon:
                                    type: string
                                    maxLength: 64
                                    description: PascalCase Lucide React icon name (e.g. Scissors, Sparkles)
                                    example: Sparkles
            responses:
                '201':
                    description: Created

    /actions/updateServiceCategory:
        post:
            tags: [Server Actions]
            summary: updateServiceCategoryAction
            description: Admin only.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    maxLength: 100
                                sortOrder:
                                    type: integer
                                    minimum: 0
                                icon:
                                    type: string
                                    nullable: true
                                    maxLength: 64
                                    description: PascalCase Lucide icon name; pass null to clear
                                    example: Palette
            responses:
                '200':
                    description: Updated

    /actions/deleteServiceCategory:
        post:
            tags: [Server Actions]
            summary: deleteServiceCategoryAction
            description: Admin only.
            responses:
                '200':
                    description: Deleted

    /actions/createService:
        post:
            tags: [Server Actions]
            summary: createServiceAction
            description: Admin only.
            responses:
                '201':
                    description: Created

    /actions/updateService:
        post:
            tags: [Server Actions]
            summary: updateServiceAction
            description: Admin only.
            responses:
                '200':
                    description: Updated

    /actions/deleteService:
        post:
            tags: [Server Actions]
            summary: deleteServiceAction
            description: Admin only.
            responses:
                '200':
                    description: Deleted

    /actions/toggleServiceVisibility:
        post:
            tags: [Server Actions]
            summary: toggleServiceVisibilityAction
            description: Admin only.
            responses:
                '200':
                    description: Updated

    /actions/createStaff:
        post:
            tags: [Server Actions]
            summary: createStaffAction
            description: Admin only. Creates staff user with bcrypt password.
            responses:
                '201':
                    description: Created

    /actions/updateStaff:
        post:
            tags: [Server Actions]
            summary: updateStaffAction
            description: Admin only.
            responses:
                '200':
                    description: Updated

    /actions/deleteStaff:
        post:
            tags: [Server Actions]
            summary: deleteStaffAction
            description: Admin only.
            responses:
                '200':
                    description: Deleted

    /actions/resetStaffPassword:
        post:
            tags: [Server Actions]
            summary: resetStaffPasswordAction
            description: Admin only. Sets a new bcrypt password for a staff user without requiring their current password.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [id, password]
                            properties:
                                id:
                                    type: string
                                    description: Staff user MongoDB id
                                password:
                                    type: string
                                    minLength: 6
            responses:
                '200':
                    description: Password reset
                '404':
                    description: Staff not found

    /actions/updateScheduleSettings:
        post:
            tags: [Server Actions]
            summary: updateScheduleSettingsAction
            description: Admin only. Updates salon_settings singleton.
            responses:
                '200':
                    description: Updated

    /actions/updatePromotionSettings:
        post:
            tags: [Server Actions]
            summary: updatePromotionSettingsAction
            description: Admin only. Updates salon_settings.promotion text fields, enabled toggle, optional dates, hideAfterExpiry, showBeforeStartDate, and accent color.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            allOf:
                                - $ref: '#/components/schemas/updatePromotionSettingsInputSchema'
                            properties:
                                color:
                                    type: string
                                    nullable: true
                                    pattern: '^#[0-9a-fA-F]{6}$'
                                    description: 'Hex promotion accent color e.g. #b91c1c; null = default red'
                                    example: '#b91c1c'
            responses:
                '200':
                    description: Promotion settings updated
                '400':
                    description: Validation failed
                '401':
                    description: Unauthorized

    /actions/uploadPromotionImage:
        post:
            tags: [Server Actions]
            summary: uploadPromotionImageAction
            description: Admin only. Accepts multipart FormData with field `file` (JPEG/PNG/WebP, max 5 MB). Uploads to Cloudinary folder Averie/promotion; deletes previous imagePublicId on replace.
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file]
                            properties:
                                file:
                                    type: string
                                    format: binary
            responses:
                '200':
                    description: Image uploaded and settings updated
                '400':
                    description: Missing file, invalid MIME type, or file too large
                '401':
                    description: Unauthorized
                '500':
                    description: Cloudinary not configured or upload failed

    /actions/removePromotionImage:
        post:
            tags: [Server Actions]
            summary: removePromotionImageAction
            description: Admin only. Deletes Cloudinary asset when imagePublicId is set and clears image fields on salon_settings.promotion.
            responses:
                '200':
                    description: Image removed
                '401':
                    description: Unauthorized
