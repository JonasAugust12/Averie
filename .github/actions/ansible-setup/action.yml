name: Ansible setup
description: >-
    Installs Ansible with the community.docker collection, writes the deploy SSH
    key, and generates the inventory from the SERVER_HOST variable. Subsequent
    steps in the calling job can run `ansible-playbook` from the `ansible`
    directory.

inputs:
    ssh_private_key:
        description: Private half of the deploy key
        required: true
    server_host:
        description: Public IP of the Bizfly server
        required: true
    server_user:
        description: Login user on the server
        required: false
        default: root
    ssh_public_key:
        description: >-
            Public half, i.e. the key Terraform put on the server. When given, it
            is checked against the private key before connecting so a mismatched
            pair is reported immediately instead of as a connection timeout.
        required: false
        default: ''

runs:
    using: composite
    steps:
        - name: Validate configuration
          shell: bash
          run: |
              missing=()
              [[ -n "${{ inputs.ssh_private_key }}" ]] || missing+=("secret SSH_PRIVATE_KEY")
              [[ -n "${{ inputs.server_host }}" ]]     || missing+=("variable SERVER_HOST")

              if (( ${#missing[@]} )); then
                for item in "${missing[@]}"; do
                  echo "::error::Missing $item"
                done
                echo "::error::Run the infra-create workflow first, or see docs/deployment-bizfly.md section 6."
                exit 1
              fi

        - name: Install Ansible
          shell: bash
          run: |
              python3 -m pip install --upgrade pip
              python3 -m pip install "ansible-core>=2.16" docker
              ansible-galaxy collection install community.docker

        - name: Configure SSH
          shell: bash
          env:
              SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
              SERVER_HOST: ${{ inputs.server_host }}
          run: |
              mkdir -p ~/.ssh
              printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/averie
              chmod 600 ~/.ssh/averie
              ssh-keyscan -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

        # A mismatched pair otherwise looks exactly like a slow boot: every
        # connection is refused and the loop below just counts to 30.
        - name: Check the key pair matches
          if: inputs.ssh_public_key != ''
          shell: bash
          env:
              EXPECTED: ${{ inputs.ssh_public_key }}
          run: |
              DERIVED=$(ssh-keygen -y -f ~/.ssh/averie)
              # Compare type + base64 only; the trailing comment is not part of the key.
              want=$(echo "$EXPECTED" | awk '{print $1, $2}')
              got=$(echo "$DERIVED"  | awk '{print $1, $2}')

              if [[ "$want" != "$got" ]]; then
                echo "::error::The SSH_PRIVATE_KEY secret and the SSH_PUBLIC_KEY variable are different key pairs."
                echo "::error::Terraform put SSH_PUBLIC_KEY on the server, so the runner cannot log in."
                echo "::error::Fix: run 'ssh-keygen -y -f ~/.ssh/averie' locally. If it prints the SSH_PUBLIC_KEY"
                echo "::error::value, update the SSH_PRIVATE_KEY secret from 'cat ~/.ssh/averie'. If it prints"
                echo "::error::something else, regenerate the pair and update BOTH, then re-run infra-create."
                echo "on the server (SSH_PUBLIC_KEY): $(ssh-keygen -lf /dev/stdin <<<"$EXPECTED" 2>/dev/null || echo unreadable)"
                echo "in the secret (SSH_PRIVATE_KEY): $(ssh-keygen -lf /dev/stdin <<<"$DERIVED" 2>/dev/null || echo unreadable)"
                exit 1
              fi
              echo "Key pair matches: $(ssh-keygen -lf /dev/stdin <<<"$DERIVED")"
              echo "ANSIBLE_PAIR_VERIFIED=true" >> "$GITHUB_ENV"

        - name: Generate inventory
          shell: bash
          working-directory: ansible
          env:
              SERVER_HOST: ${{ inputs.server_host }}
              SERVER_USER: ${{ inputs.server_user }}
          run: |
              {
                echo "[web]"
                echo "${SERVER_HOST} ansible_user=${SERVER_USER} ansible_ssh_private_key_file=~/.ssh/averie"
                echo ""
                echo "[web:vars]"
                echo "ansible_python_interpreter=/usr/bin/python3"
              } > inventory.ini
              cat inventory.ini
              echo "Connecting as ${SERVER_USER}@${SERVER_HOST}"

        - name: Wait for SSH
          shell: bash
          env:
              SERVER_HOST: ${{ inputs.server_host }}
              SERVER_USER: ${{ inputs.server_user }}
          run: |
              # A freshly created server may still be booting when this runs.
              # cloud-init writes authorized_keys once at first boot; until it
              # finishes, sshd may answer with Permission denied even when the
              # GitHub key pair is correct.
              PAIR_VERIFIED="${ANSIBLE_PAIR_VERIFIED:-false}"
              # Legacy ssh-rsa keys (e.g. Bizfly "Generated-by-Nova") need explicit
              # algorithm negotiation on Ubuntu 24.04 / OpenSSH 8.9+.
              SSH_OPTS=(
                -o StrictHostKeyChecking=no
                -o ConnectTimeout=5
                -o BatchMode=yes
                -o PubkeyAcceptedAlgorithms=+ssh-rsa,rsa-sha2-512,rsa-sha2-256
              )
              for i in $(seq 1 30); do
                OUT=$(ssh "${SSH_OPTS[@]}" -i ~/.ssh/averie \
                          "${SERVER_USER}@${SERVER_HOST}" "echo ok" 2>&1) && {
                  echo "SSH is up after $i attempt(s)."
                  exit 0
                }

                if grep -qi "permission denied\|no supported authentication" <<<"$OUT"; then
                  if [[ "${PAIR_VERIFIED}" == "true" && "$i" -lt 30 ]]; then
                    echo "Attempt $i/30 — SSH is up but the key is not accepted yet (cloud-init may still be running)..."
                    sleep 10
                    continue
                  fi

                  echo "::error::${SERVER_USER}@${SERVER_HOST} refused the deploy key: $OUT"
                  if [[ "${PAIR_VERIFIED}" == "true" ]]; then
                    echo "::error::SSH_PRIVATE_KEY and SSH_PUBLIC_KEY match each other in GitHub, but the server does not accept that key."
                    echo "::error::Bizfly Cloud default login user is root — set SERVER_USER=root (or delete SERVER_USER if it is ubuntu)."
                    echo "::error::If using a legacy ssh-rsa key, prefer ed25519 (see docs/deployment-bizfly.md §4.4)."
                    echo "::error::Otherwise push latest main, run infra-destroy, then infra-create again."
                    echo "::error::On the server, check: sudo tail -50 /var/log/cloud-init-output.log"
                  else
                    echo "::error::The private key in SSH_PRIVATE_KEY is not the one on the server."
                    echo "::error::Compare it with SSH_PUBLIC_KEY — see the key-pair check earlier in this job."
                  fi
                  exit 1
                fi

                echo "Attempt $i/30 — waiting for SSH... ($(head -1 <<<"$OUT"))"
                sleep 10
              done

              echo "::error::Could not reach ${SERVER_HOST} over SSH after 5 minutes."
              echo "::error::Last error: ${OUT}"
              exit 1
