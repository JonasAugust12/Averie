name: deploy
run-name: 'Deploy: ${{ github.event.head_commit.message || github.run_id }} (${{ github.ref_name }})'

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            image_tag:
                description: 'Existing image tag to redeploy (e.g. main-9045a20). Leave empty to build from this branch.'
                required: false
                type: string

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

env:
    REGISTRY_HOST: ${{ vars.BIZFLY_REGISTRY_HOST || 'cr-hn-1.bizflycloud.vn' }}
    REGISTRY_NAMESPACE: ${{ vars.BIZFLY_REGISTRY_NAMESPACE }}
    REGISTRY_REPOSITORY: ${{ vars.BIZFLY_REGISTRY_REPOSITORY || 'averie-web' }}

jobs:
    # =========================================================================
    # 1. Build the image and push it to Bizfly Container Registry
    # =========================================================================
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.vars.outputs.tag }}
            image: ${{ steps.vars.outputs.image }}
            build_needed: ${{ steps.vars.outputs.build_needed }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve image tag
              id: vars
              run: |
                  if [[ -z "${REGISTRY_NAMESPACE}" ]]; then
                    echo "::error::Repository variable BIZFLY_REGISTRY_NAMESPACE is not set."
                    echo "::error::Copy it from the push command shown in the Bizfly Container Registry console."
                    exit 1
                  fi

                  SHORT_SHA=$(git rev-parse --short HEAD)
                  echo "image=${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/${REGISTRY_REPOSITORY}" >> $GITHUB_OUTPUT

                  if [[ -n "${INPUT_IMAGE_TAG}" ]]; then
                    echo "tag=${INPUT_IMAGE_TAG}" >> $GITHUB_OUTPUT
                    echo "build_needed=false" >> $GITHUB_OUTPUT
                  else
                    echo "tag=${GITHUB_REF_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
                    echo "build_needed=true" >> $GITHUB_OUTPUT
                  fi
              env:
                  INPUT_IMAGE_TAG: ${{ inputs.image_tag }}

            - name: Set up Docker Buildx
              if: steps.vars.outputs.build_needed == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Log in to Bizfly Container Registry
              if: steps.vars.outputs.build_needed == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY_HOST }}
                  username: ${{ secrets.BIZFLY_REGISTRY_USERNAME }}
                  password: ${{ secrets.BIZFLY_REGISTRY_TOKEN }}

            - name: Build and push
              if: steps.vars.outputs.build_needed == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
                      ${{ steps.vars.outputs.image }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || format('https://{0}', vars.APP_VHOST || 'bizfly.averienails.com') }}
                      NEXT_PUBLIC_ROUTE_LOADING_MIN_MS=${{ vars.NEXT_PUBLIC_ROUTE_LOADING_MIN_MS || '1200' }}
                      NEXT_PUBLIC_ENABLE_OBFUSCATION=${{ vars.NEXT_PUBLIC_ENABLE_OBFUSCATION || 'false' }}
                      NEXT_PUBLIC_ENABLE_STORAGE_ENCRYPTION=${{ vars.NEXT_PUBLIC_ENABLE_STORAGE_ENCRYPTION || 'false' }}
                      NEXT_PUBLIC_ENABLE_DEVTOOLS_GUARD=${{ vars.NEXT_PUBLIC_ENABLE_DEVTOOLS_GUARD || 'false' }}
                      NEXT_PUBLIC_DEVTOOLS_REDIRECT_URL=${{ vars.NEXT_PUBLIC_DEVTOOLS_REDIRECT_URL }}
                      CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}
                      PRODUCTION_BROWSER_SOURCE_MAPS=${{ vars.PRODUCTION_BROWSER_SOURCE_MAPS || 'false' }}

            - name: Build summary
              if: always()
              run: |
                  {
                    echo "## 🚀 Build"
                    echo "| | |"
                    echo "| --- | --- |"
                    echo "| **Image** | \`${{ steps.vars.outputs.image }}\` |"
                    echo "| **Tag** | \`${{ steps.vars.outputs.tag }}\` |"
                    echo "| **Freshly built** | \`${{ steps.vars.outputs.build_needed }}\` |"
                    echo "| **Commit** | [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |"
                  } >> $GITHUB_STEP_SUMMARY

    # =========================================================================
    # 2. Deploy to the Bizfly server over SSH with Ansible
    # =========================================================================
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  pip install "ansible-core>=2.16" docker
                  ansible-galaxy collection install community.docker

            - name: Configure SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SERVER_HOST: ${{ vars.SERVER_HOST }}
              run: |
                  if [[ -z "${SERVER_HOST}" ]]; then
                    echo "::error::Repository variable SERVER_HOST is not set (use the public_ip Terraform output)."
                    exit 1
                  fi
                  mkdir -p ~/.ssh
                  printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/averie
                  chmod 600 ~/.ssh/averie
                  ssh-keyscan -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

            - name: Generate inventory
              working-directory: ansible
              env:
                  SERVER_HOST: ${{ vars.SERVER_HOST }}
                  SERVER_USER: ${{ vars.SERVER_USER || 'ubuntu' }}
              run: |
                  {
                    echo "[web]"
                    echo "${SERVER_HOST} ansible_user=${SERVER_USER} ansible_ssh_private_key_file=~/.ssh/averie"
                    echo ""
                    echo "[web:vars]"
                    echo "ansible_python_interpreter=/usr/bin/python3"
                  } > inventory.ini
                  cat inventory.ini

            # Extra vars go through a JSON file rather than a shell command line
            # so secrets containing quotes or spaces cannot break the invocation.
            - name: Build Ansible extra vars
              working-directory: ansible
              env:
                  IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
                  REGISTRY_USERNAME: ${{ secrets.BIZFLY_REGISTRY_USERNAME }}
                  REGISTRY_PASSWORD: ${{ secrets.BIZFLY_REGISTRY_TOKEN }}
                  APP_VHOST: ${{ vars.APP_VHOST || 'bizfly.averienails.com' }}
                  ENABLE_TLS: ${{ vars.ENABLE_TLS || 'false' }}
                  MONGODB_URI: ${{ secrets.MONGODB_URI }}
                  MONGODB_DNS_SERVERS: ${{ vars.MONGODB_DNS_SERVERS }}
                  MONGODB_DEBUG: ${{ vars.MONGODB_DEBUG }}
                  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
                  # Optional: only to reuse an existing Vercel deployment's sessions.
                  # auth.config.ts prefers this over AUTH_SECRET when both are set.
                  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
                  AUTH_SESSION_MAX_AGE_SECONDS: ${{ vars.AUTH_SESSION_MAX_AGE_SECONDS || '2592000' }}
                  ENABLE_OBFUSCATION: ${{ vars.ENABLE_OBFUSCATION || '0' }}
                  OBFUSCATION_SECRET: ${{ secrets.OBFUSCATION_SECRET }}
                  CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
                  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
                  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
                  SALON_TIMEZONE: ${{ vars.SALON_TIMEZONE || 'America/New_York' }}
                  ENABLE_API_DOCS: ${{ vars.ENABLE_API_DOCS || '0' }}
              run: |
                  python3 - <<'PY'
                  import json, os

                  mapping = {
                      "image_tag": "IMAGE_TAG",
                      "registry_host": "REGISTRY_HOST",
                      "registry_namespace": "REGISTRY_NAMESPACE",
                      "registry_repository": "REGISTRY_REPOSITORY",
                      "registry_username": "REGISTRY_USERNAME",
                      "registry_password": "REGISTRY_PASSWORD",
                      "app_vhost": "APP_VHOST",
                      "enable_tls": "ENABLE_TLS",
                      "mongodb_uri": "MONGODB_URI",
                      "mongodb_dns_servers": "MONGODB_DNS_SERVERS",
                      "mongodb_debug": "MONGODB_DEBUG",
                      "auth_secret": "AUTH_SECRET",
                      "nextauth_secret": "NEXTAUTH_SECRET",
                      "auth_session_max_age_seconds": "AUTH_SESSION_MAX_AGE_SECONDS",
                      "enable_obfuscation": "ENABLE_OBFUSCATION",
                      "obfuscation_secret": "OBFUSCATION_SECRET",
                      "cloudinary_cloud_name": "CLOUDINARY_CLOUD_NAME",
                      "cloudinary_api_key": "CLOUDINARY_API_KEY",
                      "cloudinary_api_secret": "CLOUDINARY_API_SECRET",
                      "salon_timezone": "SALON_TIMEZONE",
                      "enable_api_docs": "ENABLE_API_DOCS",
                  }

                  raw = {key: os.environ.get(env, "") for key, env in mapping.items()}

                  # Drop blanks so ansible/group_vars/all.yml keeps providing the
                  # default; an empty -e value would override it with "".
                  extra = {key: value for key, value in raw.items() if value != ""}
                  extra["enable_tls"] = raw["enable_tls"].strip().lower() in ("1", "true", "yes")

                  with open("extra_vars.json", "w", encoding="utf-8") as handle:
                      json.dump(extra, handle)

                  print("extra vars:", ", ".join(sorted(extra)))
                  PY
                  chmod 600 extra_vars.json

            - name: Provision and deploy
              working-directory: ansible
              env:
                  ANSIBLE_FORCE_COLOR: '1'
              run: ansible-playbook site.yml -e @extra_vars.json

            - name: Deploy summary
              if: always()
              run: |
                  {
                    echo "## 📦 Deploy"
                    echo "| | |"
                    echo "| --- | --- |"
                    echo "| **Host** | \`${{ vars.SERVER_HOST }}\` |"
                    echo "| **Image** | \`${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}\` |"
                    echo "| **Vhost** | ${{ vars.APP_VHOST || 'bizfly.averienails.com' }} |"
                    echo "| **Result** | \`${{ job.status }}\` |"
                  } >> $GITHUB_STEP_SUMMARY

            - name: Clean up credentials
              if: always()
              run: rm -f ~/.ssh/averie ansible/extra_vars.json
