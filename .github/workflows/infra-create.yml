name: infra-create
run-name: 'Infra create: ${{ inputs.flavor_name }} in ${{ inputs.availability_zone }}'

# Creates (or updates in place) the Bizfly server. Safe to re-run: Terraform
# reconciles against the state in Simple Storage rather than building a second
# server.
on:
    workflow_dispatch:
        inputs:
            flavor_name:
                description: 'Server size'
                required: true
                default: '1c_2g'
                type: choice
                options:
                    - 1c_1g
                    - 1c_2g
                    - 2c_2g
                    - 2c_4g
            availability_zone:
                description: 'Availability zone'
                required: true
                default: 'HCM1'
                type: choice
                options:
                    - HCM1
                    - HN1
                    - HN2
            root_disk_size:
                description: 'Root disk in GB (20 for 1c_*, 40 for 2c_*)'
                required: false
                default: '20'
                type: string
            update_dns:
                description: 'Point the subdomain at the new IP'
                required: false
                default: true
                type: boolean
            run_deploy:
                description: 'Trigger the deploy workflow afterwards (needs GH_ADMIN_PAT)'
                required: false
                default: true
                type: boolean

concurrency:
    group: averie-infra
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    create:
        runs-on: ubuntu-latest
        # Surfaced as env because the `secrets` context is not available in a
        # step-level `if:`.
        env:
            GH_ADMIN_PAT: ${{ secrets.GH_ADMIN_PAT }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Terraform setup
              uses: ./.github/actions/terraform-setup
              with:
                  appcred_id: ${{ secrets.BIZFLY_APPCRED_ID }}
                  appcred_secret: ${{ secrets.BIZFLY_APPCRED_SECRET }}
                  state_access_key: ${{ secrets.TF_STATE_ACCESS_KEY }}
                  state_secret_key: ${{ secrets.TF_STATE_SECRET_KEY }}
                  state_bucket: ${{ vars.TF_STATE_BUCKET }}
                  state_endpoint: ${{ vars.TF_STATE_ENDPOINT || 'https://hcm.ss.bfcplatform.vn' }}
                  state_region: ${{ vars.TF_STATE_REGION || 'hcm' }}
                  project_id: ${{ vars.BIZFLY_PROJECT_ID }}
                  ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
                  region_name: ${{ vars.BIZFLY_REGION_NAME || 'HoChiMinh' }}

            - name: Terraform apply
              working-directory: terraform
              run: |
                  terraform apply -auto-approve \
                    -var="flavor_name=${{ inputs.flavor_name }}" \
                    -var="availability_zone=${{ inputs.availability_zone }}" \
                    -var="root_disk_size=${{ inputs.root_disk_size }}" \
                    -var="server_state=running"

            - name: Verify deploy SSH key in state
              working-directory: terraform
              run: |
                  echo "SSH key Terraform registered with Bizfly:"
                  terraform state show bizflycloud_ssh_key.deploy | grep -E '^\s+(name|public_key)\s+=' || true
                  FP=$(terraform state show bizflycloud_ssh_key.deploy 2>/dev/null \
                    | sed -n 's/.*public_key.*= "\(ssh-[^ ]* [^ ]*\).*/\1/p' \
                    | head -1)
                  if [[ -n "$FP" ]]; then
                    echo "Fingerprint: $(ssh-keygen -lf /dev/stdin <<<"$FP")"
                    echo "Key type: $(awk '{print $1}' <<<"$FP")"
                  fi
                  echo ""
                  echo "cloud-init user_data (cloud-init.yaml.tftpl):"
                  head -22 cloud-init.yaml.tftpl

            - name: Read outputs
              id: tf
              working-directory: terraform
              run: |
                  IP=$(terraform output -raw public_ip 2>/dev/null || true)
                  if [[ -z "$IP" || "$IP" == "null" ]]; then
                    echo "::error::Terraform produced no public IP. Check the apply output above."
                    exit 1
                  fi
                  echo "public_ip=$IP" >> $GITHUB_OUTPUT
                  echo "Server is up at $IP"

            # Keeps the deploy pipeline pointed at the current server without a
            # manual edit. Needs a PAT with repository Variables: write.
            - name: Update SERVER_HOST repository variable
              id: setvar
              if: env.GH_ADMIN_PAT != ''
              env:
                  GH_TOKEN: ${{ secrets.GH_ADMIN_PAT }}
                  IP: ${{ steps.tf.outputs.public_ip }}
              run: |
                  if gh variable set SERVER_HOST --body "$IP" --repo "${{ github.repository }}"; then
                    echo "updated=true" >> $GITHUB_OUTPUT
                    echo "SERVER_HOST set to $IP"
                  else
                    echo "updated=false" >> $GITHUB_OUTPUT
                    echo "::warning::Could not set SERVER_HOST. Set it to $IP by hand."
                  fi

            - name: Set up Python
              if: inputs.update_dns
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Point the subdomain at the server
              if: inputs.update_dns
              run: |
                  pip install requests
                  python scripts/update_bizfly_subdomain_dns.py
              env:
                  NAME_COM_USERNAME: ${{ secrets.NAME_COM_USERNAME }}
                  NAME_COM_TOKEN: ${{ secrets.NAME_COM_TOKEN }}
                  DOMAIN_NAME: ${{ vars.DNS_ZONE || 'averienails.com' }}
                  SUBDOMAIN: ${{ vars.DNS_SUBDOMAIN || 'bizfly' }}
                  SERVER_IP: ${{ steps.tf.outputs.public_ip }}
                  RECORD_TTL: '300'

            # The server already exists by this point, so a token that cannot
            # dispatch must not turn the whole run red.
            - name: Trigger deploy
              if: inputs.run_deploy && env.GH_ADMIN_PAT != ''
              env:
                  GH_TOKEN: ${{ secrets.GH_ADMIN_PAT }}
              run: |
                  if gh workflow run deploy.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"; then
                    echo "Deploy workflow dispatched."
                  else
                    echo "::warning::Could not dispatch deploy — the token needs Actions: read and write. Run it by hand."
                  fi

            - name: Summary
              if: always()
              run: |
                  {
                    echo "## 🚀 Infrastructure created"
                    echo ""
                    echo "| | |"
                    echo "| --- | --- |"
                    echo "| **Public IP** | \`${{ steps.tf.outputs.public_ip }}\` |"
                    echo "| **Flavor** | \`${{ inputs.flavor_name }}\` |"
                    echo "| **Zone** | \`${{ inputs.availability_zone }}\` |"
                    echo "| **Root disk** | \`${{ inputs.root_disk_size }} GB\` |"
                    echo "| **SERVER_HOST updated** | \`${{ steps.setvar.outputs.updated || 'skipped - no GH_ADMIN_PAT' }}\` |"
                    echo "| **DNS updated** | \`${{ inputs.update_dns }}\` |"
                    echo "| **Result** | \`${{ job.status }}\` |"
                    echo ""
                    echo "### Next"
                    echo ""
                    echo "1. Whitelist \`${{ steps.tf.outputs.public_ip }}\` in MongoDB Atlas → Network Access."
                    echo "2. Run the \`deploy\` workflow if it was not dispatched above."
                    echo "3. If deploy SSH fails, check cloud-init: \`sudo tail -50 /var/log/cloud-init-output.log\`."
                    echo ""
                    echo '```bash'
                    echo "ssh -i ~/.ssh/averie root@${{ steps.tf.outputs.public_ip }}"
                    echo '```'
                  } >> $GITHUB_STEP_SUMMARY
