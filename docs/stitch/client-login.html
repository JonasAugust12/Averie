<!doctype html>
<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Avere - Login</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;family=Inter:wght@400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            'on-tertiary-fixed-variant': '#494643',
                            'primary-fixed-dim': '#cec5c0',
                            'on-primary': '#ffffff',
                            'on-surface': '#1a1c1c',
                            'on-error-container': '#93000a',
                            'primary-container': '#2b2623',
                            'tertiary-container': '#292724',
                            'on-background': '#1a1c1c',
                            primary: '#16120f',
                            surface: '#faf9f8',
                            'on-tertiary-fixed': '#1d1b18',
                            'on-secondary-container': '#6e6258',
                            'on-tertiary': '#ffffff',
                            outline: '#7f7570',
                            tertiary: '#141310',
                            'on-error': '#ffffff',
                            background: '#faf9f8',
                            'error-container': '#ffdad6',
                            secondary: '#685c53',
                            'inverse-primary': '#cec5c0',
                            'surface-container-highest': '#e3e2e1',
                            'on-primary-fixed': '#1f1b18',
                            'on-primary-fixed-variant': '#4c4642',
                            'surface-dim': '#dadad9',
                            'secondary-container': '#f0e0d3',
                            'on-tertiary-container': '#928e89',
                            'surface-container-low': '#f4f3f2',
                            'on-secondary-fixed': '#221a13',
                            'surface-bright': '#faf9f8',
                            'surface-container-lowest': '#ffffff',
                            'primary-fixed': '#ebe0db',
                            'secondary-fixed': '#f0e0d3',
                            'on-secondary': '#ffffff',
                            'surface-tint': '#645d59',
                            'secondary-fixed-dim': '#d3c4b8',
                            'on-primary-container': '#958c88',
                            'outline-variant': '#d0c4be',
                            'surface-container': '#eeeeed',
                            'inverse-on-surface': '#f1f0f0',
                            'inverse-surface': '#2f3130',
                            'tertiary-fixed': '#e7e1dd',
                            error: '#ba1a1a',
                            'tertiary-fixed-dim': '#cbc6c1',
                            'surface-variant': '#e3e2e1',
                            'on-secondary-fixed-variant': '#4f453c',
                            'surface-container-high': '#e9e8e7',
                            'on-surface-variant': '#4d4540',
                        },
                        borderRadius: {
                            DEFAULT: '0.125rem',
                            lg: '0.25rem',
                            xl: '0.5rem',
                            full: '0.75rem',
                        },
                        spacing: {
                            unit: '8px',
                            'margin-desktop': '64px',
                            'margin-mobile': '20px',
                            'container-max': '1280px',
                            gutter: '24px',
                        },
                        fontFamily: {
                            'label-sm': ['Inter'],
                            'headline-lg': ['Playfair Display'],
                            'display-lg': ['Playfair Display'],
                            'headline-md': ['Playfair Display'],
                            'headline-lg-mobile': ['Playfair Display'],
                            'body-lg': ['Inter'],
                            'body-md': ['Inter'],
                            'label-md': ['Inter'],
                        },
                        fontSize: {
                            'label-sm': [
                                '12px',
                                { lineHeight: '16px', letterSpacing: '0.1em', fontWeight: '600' },
                            ],
                            'headline-lg': ['40px', { lineHeight: '48px', fontWeight: '400' }],
                            'display-lg': [
                                '64px',
                                { lineHeight: '72px', letterSpacing: '-0.02em', fontWeight: '400' },
                            ],
                            'headline-md': ['28px', { lineHeight: '36px', fontWeight: '400' }],
                            'headline-lg-mobile': [
                                '32px',
                                { lineHeight: '40px', fontWeight: '400' },
                            ],
                            'body-lg': ['18px', { lineHeight: '28px', fontWeight: '400' }],
                            'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
                            'label-md': [
                                '14px',
                                { lineHeight: '20px', letterSpacing: '0.05em', fontWeight: '500' },
                            ],
                        },
                    },
                },
            };
        </script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    'FILL' 0,
                    'wght' 300,
                    'GRAD' 0,
                    'opsz' 24;
            }

            /* Custom styles for ambient shadow as per guidelines */
            .ambient-shadow {
                box-shadow: 0 10px 40px -10px rgba(43, 38, 35, 0.06);
            }
        </style>
    </head>
    <body
        class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface"
    >
        <!-- Main Container -->
        <main class="w-full max-w-[480px] mx-auto flex flex-col items-center">
            <!-- Logo Header -->
            <header class="mb-12 text-center w-full">
                <h1 class="font-display-lg text-display-lg text-primary tracking-tighter">AVERE</h1>
                <p class="font-label-sm text-label-sm text-on-surface-variant uppercase mt-2">
                    Luxury Nail Studio
                </p>
            </header>
            <!-- Login Card -->
            <section
                aria-labelledby="login-heading"
                class="bg-surface-container-lowest w-full rounded-lg border border-outline-variant ambient-shadow p-8 md:p-12"
            >
                <h2
                    class="font-headline-md text-headline-md text-primary mb-8 text-center"
                    id="login-heading"
                >
                    Sign In
                </h2>
                <form action="#" class="space-y-6" method="POST">
                    <!-- Email Field -->
                    <div>
                        <label
                            class="block font-label-sm text-label-sm text-on-surface uppercase mb-2"
                            for="email"
                            >Email Address</label
                        >
                        <div class="relative">
                            <input
                                class="block w-full border-0 border-b border-outline-variant bg-transparent py-3 pl-0 pr-10 text-on-surface focus:ring-0 focus:border-primary font-body-md text-body-md placeholder:text-on-surface-variant/50 transition-colors"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                required=""
                                type="email"
                            />
                            <div
                                class="absolute inset-y-0 right-0 flex items-center pointer-events-none"
                            >
                                <span
                                    class="material-symbols-outlined text-on-surface-variant/50"
                                    data-icon="mail"
                                    >mail</span
                                >
                            </div>
                        </div>
                    </div>
                    <!-- Password Field -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label
                                class="block font-label-sm text-label-sm text-on-surface uppercase"
                                for="password"
                                >Password</label
                            >
                            <a
                                class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors uppercase"
                                href="#"
                                >Forgot?</a
                            >
                        </div>
                        <div class="relative">
                            <input
                                class="block w-full border-0 border-b border-outline-variant bg-transparent py-3 pl-0 pr-10 text-on-surface focus:ring-0 focus:border-primary font-body-md text-body-md placeholder:text-on-surface-variant/50 transition-colors"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required=""
                                type="password"
                            />
                            <div
                                class="absolute inset-y-0 right-0 flex items-center pointer-events-none"
                            >
                                <span
                                    class="material-symbols-outlined text-on-surface-variant/50"
                                    data-icon="lock"
                                    >lock</span
                                >
                            </div>
                        </div>
                    </div>
                    <!-- Submit Button -->
                    <div class="pt-6">
                        <button
                            class="w-full flex justify-center py-4 px-6 bg-primary text-on-primary font-label-md text-label-md uppercase tracking-widest hover:opacity-90 transition-opacity rounded-sm"
                            type="submit"
                        >
                            Sign In
                        </button>
                    </div>
                </form>
                <!-- Footer Links -->
                <div class="mt-8 text-center">
                    <p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account?
                        <a
                            class="font-label-md text-label-md text-primary underline decoration-outline-variant hover:decoration-primary transition-colors underline-offset-4 ml-1"
                            href="#"
                            >Create Account</a
                        >
                    </p>
                </div>
            </section>
            <!-- Decorative subtle element -->
            <div class="mt-16 w-12 h-[1px] bg-outline-variant/50"></div>
        </main>
    </body>
</html>
