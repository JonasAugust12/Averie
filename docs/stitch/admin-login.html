<!doctype html>
<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>AVERE - Salon Management Login</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@400;500;600;700&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            'on-tertiary-fixed-variant': '#494643',
                            'primary-fixed-dim': '#cec5c0',
                            'on-primary': '#ffffff',
                            'on-surface': '#1a1c1c',
                            'on-error-container': '#93000a',
                            'primary-container': '#2b2623',
                            'tertiary-container': '#292724',
                            'on-background': '#1a1c1c',
                            primary: '#16120f',
                            surface: '#faf9f8',
                            'on-tertiary-fixed': '#1d1b18',
                            'on-secondary-container': '#6e6258',
                            'on-tertiary': '#ffffff',
                            outline: '#7f7570',
                            tertiary: '#141310',
                            'on-error': '#ffffff',
                            background: '#faf9f8',
                            'error-container': '#ffdad6',
                            secondary: '#685c53',
                            'inverse-primary': '#cec5c0',
                            'surface-container-highest': '#e3e2e1',
                            'on-primary-fixed': '#1f1b18',
                            'on-primary-fixed-variant': '#4c4642',
                            'surface-dim': '#dadad9',
                            'secondary-container': '#f0e0d3',
                            'on-tertiary-container': '#928e89',
                            'surface-container-low': '#f4f3f2',
                            'on-secondary-fixed': '#221a13',
                            'surface-bright': '#faf9f8',
                            'surface-container-lowest': '#ffffff',
                            'primary-fixed': '#ebe0db',
                            'secondary-fixed': '#f0e0d3',
                            'on-secondary': '#ffffff',
                            'surface-tint': '#645d59',
                            'secondary-fixed-dim': '#d3c4b8',
                            'on-primary-container': '#958c88',
                            'outline-variant': '#d0c4be',
                            'surface-container': '#eeeeed',
                            'inverse-on-surface': '#f1f0f0',
                            'inverse-surface': '#2f3130',
                            'tertiary-fixed': '#e7e1dd',
                            error: '#ba1a1a',
                            'tertiary-fixed-dim': '#cbc6c1',
                            'surface-variant': '#e3e2e1',
                            'on-secondary-fixed-variant': '#4f453c',
                            'surface-container-high': '#e9e8e7',
                            'on-surface-variant': '#4d4540',
                        },
                        borderRadius: {
                            DEFAULT: '0.125rem',
                            lg: '0.25rem',
                            xl: '0.5rem',
                            full: '0.75rem',
                        },
                        spacing: {
                            unit: '8px',
                            'margin-desktop': '64px',
                            'margin-mobile': '20px',
                            'container-max': '1280px',
                            gutter: '24px',
                        },
                        fontFamily: {
                            'label-sm': ['Inter'],
                            'headline-lg': ['Playfair Display'],
                            'display-lg': ['Playfair Display'],
                            'headline-md': ['Playfair Display'],
                            'headline-lg-mobile': ['Playfair Display'],
                            'body-lg': ['Inter'],
                            'body-md': ['Inter'],
                            'label-md': ['Inter'],
                        },
                        fontSize: {
                            'label-sm': [
                                '12px',
                                {
                                    lineHeight: '16px',
                                    letterSpacing: '0.1em',
                                    fontWeight: '600',
                                },
                            ],
                            'headline-lg': [
                                '40px',
                                {
                                    lineHeight: '48px',
                                    fontWeight: '400',
                                },
                            ],
                            'display-lg': [
                                '64px',
                                {
                                    lineHeight: '72px',
                                    letterSpacing: '-0.02em',
                                    fontWeight: '400',
                                },
                            ],
                            'headline-md': [
                                '28px',
                                {
                                    lineHeight: '36px',
                                    fontWeight: '400',
                                },
                            ],
                            'headline-lg-mobile': [
                                '32px',
                                {
                                    lineHeight: '40px',
                                    fontWeight: '400',
                                },
                            ],
                            'body-lg': [
                                '18px',
                                {
                                    lineHeight: '28px',
                                    fontWeight: '400',
                                },
                            ],
                            'body-md': [
                                '16px',
                                {
                                    lineHeight: '24px',
                                    fontWeight: '400',
                                },
                            ],
                            'label-md': [
                                '14px',
                                {
                                    lineHeight: '20px',
                                    letterSpacing: '0.05em',
                                    fontWeight: '500',
                                },
                            ],
                        },
                    },
                },
            };
        </script>
        <style>
            /* Custom styles to enhance the minimalist aesthetic */
            input:focus {
                box-shadow: none !important;
                border-color: #7f7570 !important; /* outline color */
            }

            .glass-panel {
                background: rgba(250, 249, 248, 0.85);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
        </style>
    </head>
    <body
        class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-screen flex items-center justify-center relative overflow-hidden"
    >
        <!-- Ambient Background Element -->
        <div class="absolute inset-0 z-0 opacity-40">
            <div
                class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container blur-[100px]"
            ></div>
            <div
                class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-surface-container-highest blur-[120px]"
            ></div>
        </div>
        <!-- Login Container -->
        <main class="w-full max-w-md px-margin-mobile md:px-0 z-10 relative">
            <div
                class="glass-panel border border-outline-variant/30 rounded-xl p-8 md:p-12 shadow-[0_8px_32px_rgba(43,38,35,0.04)]"
            >
                <!-- Header Section -->
                <div class="text-center mb-10">
                    <h1
                        class="font-display-lg text-headline-md md:text-display-lg tracking-tighter text-primary mb-2"
                    >
                        AVERE
                    </h1>
                    <h2 class="font-headline-md text-headline-md text-on-surface-variant">
                        Salon Management
                    </h2>
                    <p
                        class="font-label-md text-label-md text-on-secondary-container mt-4 uppercase tracking-widest"
                    >
                        Authorized Access Only
                    </p>
                </div>
                <!-- Login Form -->
                <form action="#" class="space-y-6" method="POST">
                    <!-- Email/Username Input -->
                    <div class="relative">
                        <label
                            class="block font-label-sm text-label-sm uppercase text-on-surface-variant mb-2"
                            for="email"
                            >Admin Email</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-0 text-on-surface-variant ml-3 text-[20px]"
                                >mail</span
                            >
                            <input
                                class="w-full bg-transparent border-0 border-b border-outline-variant/50 focus:border-outline py-3 pl-10 pr-4 font-body-md text-on-surface placeholder:text-on-surface-variant/40 transition-colors duration-300"
                                id="email"
                                name="email"
                                placeholder="admin@avere.com"
                                required=""
                                type="email"
                            />
                        </div>
                    </div>
                    <!-- Password Input -->
                    <div class="relative">
                        <div class="flex justify-between items-center mb-2">
                            <label
                                class="block font-label-sm text-label-sm uppercase text-on-surface-variant"
                                for="password"
                                >Password</label
                            >
                            <a
                                class="font-label-md text-label-md text-on-secondary-container hover:text-primary transition-colors text-xs"
                                href="#"
                                >Forgot?</a
                            >
                        </div>
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-0 text-on-surface-variant ml-3 text-[20px]"
                                >lock</span
                            >
                            <input
                                class="w-full bg-transparent border-0 border-b border-outline-variant/50 focus:border-outline py-3 pl-10 pr-10 font-body-md text-on-surface placeholder:text-on-surface-variant/40 transition-colors duration-300"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required=""
                                type="password"
                            />
                            <button
                                aria-label="Toggle password visibility"
                                class="absolute right-0 text-on-surface-variant mr-3 hover:text-primary transition-colors focus:outline-none"
                                type="button"
                            >
                                <span class="material-symbols-outlined text-[20px]"
                                    >visibility_off</span
                                >
                            </button>
                        </div>
                    </div>
                    <!-- Remember Me -->
                    <div class="flex items-center mt-4">
                        <input
                            class="h-4 w-4 rounded-DEFAULT border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface bg-transparent cursor-pointer"
                            id="remember-me"
                            name="remember-me"
                            type="checkbox"
                        />
                        <label
                            class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer"
                            for="remember-me"
                        >
                            Keep me signed in
                        </label>
                    </div>
                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button
                            class="w-full bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest py-4 px-6 rounded-DEFAULT hover:opacity-90 hover:bg-tertiary transition-all duration-300 flex items-center justify-center group"
                            type="submit"
                        >
                            Admin Access
                            <span
                                class="material-symbols-outlined ml-2 text-[18px] group-hover:translate-x-1 transition-transform duration-300"
                                >arrow_forward</span
                            >
                        </button>
                    </div>
                </form>
                <!-- Security Badge -->
                <div
                    class="mt-8 pt-6 border-t border-outline-variant/20 flex items-center justify-center text-on-surface-variant/60"
                >
                    <span class="material-symbols-outlined text-[16px] mr-2">verified_user</span>
                    <span class="font-label-sm text-label-sm uppercase tracking-wider text-[10px]"
                        >Secure Encrypted Connection</span
                    >
                </div>
            </div>
        </main>
    </body>
</html>
