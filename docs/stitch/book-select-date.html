<!doctype html>

        <style>
            .custom-scrollbar::-webkit-scrollbar {
                width: 4px;
            }

                background: transparent;
            }

    <body

        <!-- Top Navigation (Shared Component styling logic applied, suppressed for transactional intent as per mandate) -->

            <a class="font-display-lg text-headline-md tracking-tighter text-primary" href="#"

            <button

            </button>
            <div class="hidden md:flex items-center space-x-8">

                    <span class="material-symbols-outlined" data-icon="close">close</span>
                </button>
            </div>
        </header>

                <div

                    Step 3 of 7

                <div class="w-full flex items-center justify-between relative">
                    <div

                    <div
                        class="absolute left-0 top-1/2 -translate-y-1/2 w-2/7 h-[1px] bg-primary z-0 transition-all duration-500 ease-in-out"
                        style="width: 42.85%"

                    <div class="w-2 h-2 rounded-full bg-primary z-10"></div>
                    <div class="w-2 h-2 rounded-full bg-primary z-10"></div>
                    <div class="w-3 h-3 rounded-full bg-primary ring-4 ring-surface z-10 relative">

                    <div class="w-2 h-2 rounded-full bg-outline-variant/50 z-10"></div>
                </div>
            </div>

                    class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-4"
                >
                    Select Date
                </h1>
                <p class="font-body-md text-body-md text-secondary max-w-md mx-auto">
                    Choose a preferred date for your appointment. We recommend booking in advance to
                    ensure availability.
                </p>
            </div>
            <!-- Calendar Container -->

                    <button

                        <span class="material-symbols-outlined text-[24px]" data-icon="chevron_left"

                    </button>
                    <h2 class="font-display-lg text-headline-md text-primary text-center">
                        October 2026
                    </h2>
                    <button
                        class="w-12 h-12 flex items-center justify-center rounded-full border border-outline-variant/50 text-secondary hover:text-primary hover:border-primary transition-all duration-300"

                        <span

                            data-icon="chevron_right"
                            >chevron_right</span

                    </button>

                            Tue
                        </div>
                        <div

                        >
                            Wed
                        </div>
                        <div
                            class="text-center font-label-sm text-label-sm uppercase text-secondary"
                        >
                            Thu
                        </div>
                        <div
                            class="text-center font-label-sm text-label-sm uppercase text-secondary"
                        >
                            Fri
                        </div>
                        <div

                            Sat

                        <div

                        <button
